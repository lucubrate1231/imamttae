# 되돌리기: 예전 버전(태그)을 골라 베타 주소(루트)나 미리보기에 다시 배포합니다. 2~3분 걸립니다.
name: redeploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '다시 배포할 버전 (예: v0.1.0)'
        required: true
      target:
        description: 'root(베타 주소) 또는 next(미리보기)'
        required: true
        default: root
        type: choice
        options: [root, next]
permissions:
  contents: write
concurrency: { group: pages-publish, cancel-in-progress: false }
jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY }}
          VITE_MAP_MODE: kakao
      - run: bash scripts/publish-pages.sh
        env:
          TARGET: ${{ inputs.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
