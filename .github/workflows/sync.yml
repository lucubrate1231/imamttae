# 글 목록만 동기화합니다. 검사 실패 시 PR 단계로 가지 않습니다.
name: 브런치 매일 동기화
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: brunch-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/brunch
          key: brunch-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: brunch-${{ runner.os }}-
      - name: 동기화와 변경 검사 (실패하면 PR 없음)
        id: daily
        run: npx tsx pipeline/daily.ts
        env:
          SYNC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: 통과한 두 데이터 파일만 PR로 올리기
        if: steps.daily.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_TITLE: ${{ steps.daily.outputs.title }}
          PR_BODY_FILE: ${{ steps.daily.outputs.body_file }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REF_TYPE" = branch
          test "$BASE_BRANCH" != bot/brunch-sync
          # 다른 테스트 가지에 열린 같은 봇 PR이 있으면 먼저 사람이 확인합니다.
          open_base=$(gh pr list --head bot/brunch-sync --state open --json baseRefName --jq '.[0].baseRefName // empty')
          if [ -n "$open_base" ] && [ "$open_base" != "$BASE_BRANCH" ]; then
            echo '다른 가지를 대상으로 한 동기화 PR이 열려 있습니다. 그 PR을 확인해 주세요.' >&2
            exit 1
          fi
          expected=$(git ls-remote origin refs/heads/bot/brunch-sync | cut -f1)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B bot/brunch-sync
          git add -- content/brunch/index.json public/data/scenes.json
          git diff --cached --quiet && exit 0
          git commit -m "$PR_TITLE"
          git push --force-with-lease="refs/heads/bot/brunch-sync:$expected" origin HEAD:refs/heads/bot/brunch-sync
          number=$(gh pr list --head bot/brunch-sync --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$PR_TITLE" --body-file "$PR_BODY_FILE"
          else
            gh pr create --head bot/brunch-sync --base "$BASE_BRANCH" --title "$PR_TITLE" --body-file "$PR_BODY_FILE"
          fi
