<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>대표 사진 고르기 · 이맘때 풍경</title>
    <style>
      /* 풍경 찾기 타일의 대표 사진 고르기(D44). 미리보기 /next/_review/covers/ — 고른 값은 이 브라우저에 저장, [결과 복사]로 넘김 */
      :root { --ink: #1f2421; --ink-2: #4f5753; --ink-3: #66716b; --line: #dfe3df; --soft: #f3f5f2; --bg: #fff; --pick: #a9481f; --pick-soft: #f6e3d8; --ok: #2e6b4a; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 17px/1.55 system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); word-break: keep-all; }
      header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 6px; }
      h1 { margin: 0; font-size: 20px; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
      .prog { color: var(--ink-2); font-size: 15px; }
      .hint { margin: 0; color: var(--ink-3); font-size: 14px; }
      button.main { border: 0; border-radius: 10px; padding: 10px 14px; font: 700 16px system-ui, sans-serif; background: var(--ok); color: #fff; cursor: pointer; min-height: 44px; }
      .msg { color: var(--ok); font-weight: 700; font-size: 14px; }
      textarea { width: 100%; height: 90px; font: 12px/1.4 ui-monospace, monospace; border: 1.5px solid var(--line); border-radius: 9px; }
      nav.jump { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
      nav.jump a { flex: none; font-size: 14px; padding: 4px 10px; border-radius: 99px; background: var(--soft); color: var(--ink-2); text-decoration: none; white-space: nowrap; }
      nav.jump a.done { background: var(--pick-soft); color: var(--pick); font-weight: 700; }
      main { padding: 8px 16px 48px; display: grid; gap: 28px; }
      section { scroll-margin-top: 150px; display: grid; gap: 10px; }
      h2 { margin: 0; font-size: 19px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
      h2 small { font-weight: 400; color: var(--ink-3); font-size: 14px; }
      h2 .got { font-size: 13px; font-weight: 700; color: var(--pick); background: var(--pick-soft); border-radius: 99px; padding: 1px 8px; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      @media (min-width: 700px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
      .ph { position: relative; display: grid; gap: 3px; border: 0; padding: 0; background: none; text-align: left; font: inherit; cursor: pointer; min-width: 0; }
      .ph img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: var(--soft); outline: 3px solid transparent; outline-offset: -3px; }
      .ph small { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; overflow-wrap: anywhere; }
      .ph .tag { position: absolute; left: 6px; top: 6px; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 1px 6px; color: #fff; }
      .ph.on img { outline-color: var(--pick); }
      .ph.on .tag { background: var(--pick); }
      .ph.used img { opacity: .45; }
      .ph.used .tag { background: var(--ink-2); }
      .moved { font-size: 14px; color: var(--pick); margin: 0; }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--pick); outline-offset: 2px; }
      .credit { font-size: 12px; color: var(--ink-3); padding: 0 16px 24px; }
    </style>
  </head>
  <body>
    <header>
      <h1>대표 사진 고르기</h1>
      <div class="bar"><span class="prog" id="prog"></span><button class="main" id="copy" type="button">결과 복사</button><span class="msg" id="copymsg" role="status"></span></div>
      <p class="hint">풍경마다 그 풍경이 가장 잘 보이는 사진 하나를 눌러 주세요. 고른 값은 이 브라우저에 저장돼요. 다 고르면 [결과 복사]를 눌러 Claude Code에 붙여 넣어 주세요.</p>
      <textarea id="copybox" hidden readonly aria-label="복사할 결과"></textarea>
      <nav class="jump" id="jump" aria-label="풍경으로 바로 가기"></nav>
    </header>
    <main id="main"><p class="hint">불러오는 중…</p></main>
    <footer class="credit">사진 이상호(브런치)</footer>
    <script>
      const $ = (s) => document.querySelector(s);
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      const thumb = (src) => 'https://img1.daumcdn.net/thumb/C240x240/?fname=' + encodeURIComponent(src);
      const KEY = 'imamttae-covers';
      const readLocal = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { return null; } };
      const writeLocal = (v) => { try { localStorage.setItem(KEY, JSON.stringify(v)); return true; } catch { return false; } };
      let types = [], chosen = {}, moved = {};
      const same = (a, b) => a && b && a.scene === b.scene && a.photo === b.photo;
      const ownerOf = (scene, photo) => Object.keys(chosen).find((t) => same(chosen[t], { scene, photo }));
      const labelOf = (id) => types.find((t) => t.id === id)?.label ?? id;

      function render() {
        const n = types.filter((t) => chosen[t.id]).length;
        $('#prog').textContent = `${types.length}개 중 ${n}개 고름`;
        $('#jump').innerHTML = types.map((t) => `<a href="#t-${t.id}" class="${chosen[t.id] ? 'done' : ''}">${esc(t.label)}</a>`).join('');
        $('#main').innerHTML = types
          .map((t) => {
            const count = t.scenes.reduce((a, s) => a + s.photos.length, 0);
            const cells = t.scenes
              .flatMap((s) => s.photos.map((src, i) => {
                const photo = i + 1;
                const owner = ownerOf(s.id, photo);
                const on = owner === t.id;
                const used = owner && !on;
                const tag = on ? '고름' : used ? `${esc(labelOf(owner))} 대표` : '';
                return `<button type="button" class="ph${on ? ' on' : ''}${used ? ' used' : ''}" data-t="${t.id}" data-s="${esc(s.id)}" data-p="${photo}" aria-pressed="${on}" aria-label="${esc(s.name)} ${photo}번째 사진${on ? ', 고름' : used ? `, ${esc(labelOf(owner))} 대표로 고름` : ''}">
                  <img loading="lazy" decoding="async" src="${esc(thumb(src))}" alt="">${tag ? `<span class="tag">${tag}</span>` : ''}
                  <small>${esc(s.name)} · ${photo}번째</small></button>`;
              }))
              .join('');
            return `<section id="t-${t.id}" aria-labelledby="h-${t.id}"><h2 id="h-${t.id}">${esc(t.label)} <small>${t.scenes.length}곳 · ${count}장</small>${chosen[t.id] ? '<span class="got">고름</span>' : ''}</h2>${moved[t.id] ? `<p class="moved">${esc(moved[t.id])}</p>` : ''}<div class="grid">${cells || '<p class="hint">이 풍경에 든 장면이 아직 없어요.</p>'}</div></section>`;
          })
          .join('');
        document.querySelectorAll('.ph').forEach((b) => b.addEventListener('click', () => pick(b.dataset.t, b.dataset.s, Number(b.dataset.p))));
      }
      function pick(t, scene, photo) {
        moved = {};
        if (same(chosen[t], { scene, photo })) delete chosen[t]; // 다시 누르면 고르기 취소
        else {
          const owner = ownerOf(scene, photo);
          if (owner) { delete chosen[owner]; moved[t] = `'${labelOf(owner)}'에서 빼고 여기 대표로 옮겼어요. '${labelOf(owner)}'는 다시 골라 주세요.`; }
          chosen[t] = { scene, photo };
        }
        writeLocal(chosen);
        const y = window.scrollY;
        render();
        window.scrollTo(0, y);
      }
      $('#copy').addEventListener('click', async () => {
        const n = types.filter((t) => chosen[t.id]).length;
        const text = JSON.stringify({ format: 'imamttae-covers/1', exportedAt: new Date().toISOString(), count: n, covers: chosen }, null, 1);
        const box = $('#copybox');
        try { await navigator.clipboard.writeText(text); box.hidden = true; $('#copymsg').textContent = `${n}개 복사했어요`; }
        catch { box.value = text; box.hidden = false; box.focus(); box.select(); $('#copymsg').textContent = '아래 글을 모두 골라 복사해 주세요'; }
      });
      fetch('./data.json').then((r) => r.json()).then((d) => {
        types = d.types;
        chosen = readLocal() ?? { ...d.chosen };
        render();
      });
    </script>
  </body>
</html>
